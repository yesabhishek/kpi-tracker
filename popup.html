<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <h1 class="logo">KPI Tracker</h1>
        <button class="settings-btn" id="settingsBtn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="1.5" fill="currentColor" />
            <circle cx="8" cy="3" r="1.5" fill="currentColor" />
            <circle cx="8" cy="13" r="1.5" fill="currentColor" />
          </svg>
        </button>
      </div>
      <div class="date-nav">
        <button class="nav-btn" id="prevDay" title="Previous day">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <button class="date-btn" id="todayBtn">Today</button>
        <span class="current-date" id="currentDate"></span>
        <button class="nav-btn" id="nextDay" title="Next day">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Add Achievement Form -->
    <div class="add-form">
      <div class="input-row">
        <input type="text" id="achievementInput" placeholder="What did you accomplish?" autocomplete="off">
      </div>
      <div class="form-actions">
        <select id="categorySelect">
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="learning">Learning</option>
          <option value="health">Health</option>
          <option value="other">Other</option>
        </select>
        <button class="add-btn" id="addBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1V13M1 7H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          Add
        </button>
      </div>
    </div>

    <!-- Achievements List -->
    <div class="achievements-section">
      <div class="section-header">
        <span class="section-title">Today's Wins</span>
        <span class="count" id="achievementCount">0 items</span>
      </div>
      <div class="achievements-list" id="achievementsList">
        <!-- Achievements will be rendered here -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" />
              <path d="M18 24L22 28L30 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <p class="empty-title">No achievements yet</p>
          <p class="empty-subtitle">Start logging your wins for today</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button class="export-btn" id="exportBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M2 12V13C2 13.5523 2.44772 14 3 14H13C13.5523 14 14 13.5523 14 13V12" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" />
        </svg>
        Export
        <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 5L6 8L9 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </footer>
  </div>

  <!-- Export Modal -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Export Achievements</h2>
        <button class="modal-close" id="modalClose">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Date Range Selection -->
        <div class="form-group">
          <label class="form-label">Date Range</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="dateRange" value="today" checked>
              <span class="radio-label">Today</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="dateRange" value="week">
              <span class="radio-label">This Week</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="dateRange" value="month">
              <span class="radio-label">This Month</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="dateRange" value="all">
              <span class="radio-label">All Time</span>
            </label>
          </div>
        </div>

        <!-- Export Preview -->
        <div class="export-preview" id="exportPreview">
          <span class="preview-count" id="previewCount">0</span>
          <span class="preview-label">achievements to export</span>
        </div>

        <!-- Format Selection -->
        <div class="form-group">
          <label class="form-label">Format</label>
          <div class="format-buttons">
            <button class="format-btn active" data-format="csv">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5" />
                <path d="M2 6H14M6 6V14" stroke="currentColor" stroke-width="1.5" />
              </svg>
              CSV
            </button>
            <button class="format-btn" data-format="pdf">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 2H10L13 5V14H4V2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                <path d="M10 2V5H13" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              </svg>
              PDF
            </button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" id="cancelExport">Cancel</button>
        <button class="btn-primary" id="confirmExport">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1V9M7 9L4 6M7 9L10 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M1 10V12C1 12.5523 1.44772 13 2 13H12C12.5523 13 13 12.5523 13 12V10" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" />
          </svg>
          Export
        </button>
      </div>
    </div>
  </div>

  <script src="libs/jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
