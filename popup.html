<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>KPI Tracker</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon32.png" width="18" height="18" alt="">
        <span>KPI Tracker</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="searchBtn" type="button" title="Search  /" aria-label="Search all wins">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        </button>
        <button class="icon-btn" id="menuBtn" type="button" title="More" aria-label="More options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true" class="fill"><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/></svg>
        </button>
      </div>
    </header>

    <!-- Day view -->
    <main class="view" id="dayView">
      <section class="page-head">
        <div class="date-row">
          <label class="date-title" title="Pick a date">
            <span id="dateTitle">Today</span>
            <input type="date" id="datePicker" aria-label="Pick a date">
          </label>
          <div class="day-nav">
            <button class="icon-btn" id="prevDay" type="button" title="Previous day  ←" aria-label="Previous day">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 12L6 8l4-4"/></svg>
            </button>
            <button class="text-btn" id="todayBtn" type="button" title="Jump to today  T">Today</button>
            <button class="icon-btn" id="nextDay" type="button" title="Next day  →" aria-label="Next day">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
            </button>
          </div>
        </div>
        <p class="date-sub" id="dateSub"></p>

        <dl class="props">
          <div class="prop">
            <dt><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10.5" rx="1.5"/><path d="M2.5 6.5h11M5.5 1.5v3M10.5 1.5v3"/></svg>This week</dt>
            <dd id="statWeek">0</dd>
          </div>
          <div class="prop">
            <dt><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.5 2.5 3.5 4 3.5 7.5a3.5 3.5 0 0 1-7 0c0-1.6.8-2.7 1.6-3.5.2 1.2.8 2 1.6 2.3C7.4 5.6 7.4 3.4 8 1.5z"/></svg>Streak</dt>
            <dd id="statStreak">0 days</dd>
          </div>
          <div class="prop">
            <dt><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V8M8 11V4.5M11.5 11V6.5"/></svg>All time</dt>
            <dd id="statTotal">0</dd>
          </div>
        </dl>
      </section>

      <form class="composer" id="addForm" autocomplete="off">
        <svg class="composer-plus" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        <input type="text" id="entryInput" maxlength="500" placeholder="Log a win, press Enter…" aria-label="New win" spellcheck="true">
        <select class="tag tag-select" id="categorySelect" aria-label="Category"></select>
      </form>

      <ul class="entries" id="entryList" aria-label="Wins for this day"></ul>

      <div class="empty" id="emptyState">
        <p class="empty-title">Nothing logged yet</p>
        <p class="empty-sub">Shipped a feature, unblocked a teammate, learned something new? Write it down while it's fresh.</p>
      </div>
    </main>

    <!-- Search view -->
    <main class="view" id="searchView" hidden>
      <div class="search-bar">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input type="search" id="searchInput" placeholder="Search all wins…" aria-label="Search all wins" maxlength="100">
        <button class="text-btn" id="searchClose" type="button">Done</button>
      </div>
      <div class="search-filters" id="searchFilters" role="group" aria-label="Filter by category"></div>
      <div class="search-results" id="searchResults" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <span class="footer-note">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
        Stored only on this device
      </span>
      <button class="btn btn-primary" id="exportBtn" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M5 7l3 3 3-3M2.5 11.5v1a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1"/></svg>
        Export
      </button>
    </footer>
  </div>

  <!-- More menu -->
  <div class="menu" id="menu" role="menu" hidden>
    <div class="menu-label">Appearance</div>
    <div class="segmented" id="themeSwitch" role="group" aria-label="Theme">
      <button type="button" data-theme="system">System</button>
      <button type="button" data-theme="light">Light</button>
      <button type="button" data-theme="dark">Dark</button>
    </div>
    <div class="menu-sep"></div>
    <button class="menu-item" type="button" role="menuitem" id="backupBtn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M5 7l3 3 3-3M2.5 11.5v1a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1"/></svg>
      Back up data
    </button>
    <button class="menu-item" type="button" role="menuitem" id="restoreBtn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2M5 5l3-3 3 3M2.5 11.5v1a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1"/></svg>
      Restore from backup…
    </button>
    <div class="menu-sep"></div>
    <button class="menu-item" type="button" role="menuitem" id="shortcutBtn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5"/><path d="M4 7h.01M6.5 7h.01M9 7h.01M11.5 7h.01M5 10h6"/></svg>
      Keyboard shortcut
      <kbd id="shortcutKey">Alt+Shift+K</kbd>
    </button>
    <a class="menu-item" role="menuitem" href="https://github.com/yesabhishek/kpi-tracker/blob/main/PRIVACY_POLICY.md" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.5 2v4c0 3.5-2.5 6-5.5 7-3-1-5.5-3.5-5.5-7v-4z"/></svg>
      Privacy policy
    </a>
  </div>

  <!-- Export dialog -->
  <dialog class="dialog" id="exportDialog" aria-labelledby="exportTitle">
    <form method="dialog" class="dialog-inner" id="exportForm">
      <header class="dialog-head">
        <h2 id="exportTitle">Export</h2>
        <button class="icon-btn" type="submit" value="cancel" aria-label="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </header>

      <fieldset class="field">
        <legend>Range</legend>
        <div class="options" id="rangeOptions"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Format</legend>
        <div class="segmented wide" id="formatSwitch" role="group" aria-label="Format">
          <button type="button" data-format="pdf">PDF</button>
          <button type="button" data-format="csv">CSV</button>
          <button type="button" data-format="md">Markdown</button>
        </div>
      </fieldset>

      <p class="export-summary" id="exportSummary"></p>

      <footer class="dialog-foot">
        <button class="btn" type="button" id="copyBtn" title="Copy as Markdown — paste into docs, Slack or review forms">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5a1 1 0 0 0-1-1H3.5a1 1 0 0 0-1 1V10a1 1 0 0 0 1 1H5"/></svg>
          Copy
        </button>
        <button class="btn btn-primary" type="button" id="downloadBtn">Download</button>
      </footer>
    </form>
  </dialog>

  <input type="file" id="restoreInput" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" class="toast-action" id="toastAction" hidden>Undo</button>
  </div>
</body>
</html>
