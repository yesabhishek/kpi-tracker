<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Store screenshots</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #f7f7f5;
    color: #37352f;
  }
  body.dark { background: #191919; color: rgba(255,255,255,.86); }
  .stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; }
  .copy { width: 640px; padding-left: 104px; padding-right: 40px; }
  .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; margin-bottom: 26px; }
  .eyebrow img { width: 28px; height: 28px; }
  h1 { font-size: 54px; line-height: 1.08; letter-spacing: -0.025em; font-weight: 700; }
  p.lead { margin-top: 20px; font-size: 21px; line-height: 1.5; color: rgba(55,53,47,.65); max-width: 470px; }
  body.dark p.lead { color: rgba(255,255,255,.55); }
  ul { list-style: none; margin-top: 30px; display: grid; gap: 12px; }
  li { display: flex; align-items: center; gap: 12px; font-size: 18px; }
  li svg { width: 20px; height: 20px; flex: none; }
  .frame {
    position: absolute;
    right: 120px;
    top: 50%;
    width: 380px;
    height: 580px;
    transform: translateY(-50%) scale(1.22);
    transform-origin: center;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(15,15,15,.06), 0 10px 24px rgba(15,15,15,.10), 0 32px 80px rgba(15,15,15,.16);
  }
  body.dark .frame { background: #191919; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 32px 80px rgba(0,0,0,.6); }
  iframe { width: 380px; height: 580px; border: 0; display: block; }
  /* promo tiles */
  body.tile { width: 440px; height: 280px; }
  body.marquee { width: 1400px; height: 560px; }
</style>
</head>
<body>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const shot = params.get('shot') || '1';

  /* ---------- Demo data ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = (n) => new Date(today.getFullYear(), today.getMonth(), today.getDate() + n);
  const at = (d, h, m) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m).getTime();

  const pool = [
    ['work', 'Launched the pricing page A/B test'],
    ['work', 'Reduced API p95 latency from 420ms to 180ms'],
    ['leadership', 'Mentored two interns through their first code reviews'],
    ['work', 'Wrote the RFC for the notifications service'],
    ['learning', 'Completed the cloud architecture practice exam — 86%'],
    ['work', 'Launched dark mode to 100% of users'],
    ['health', 'Gym — new deadlift PR'],
    ['work', 'Cut CI build time by 35% with dependency caching'],
    ['leadership', 'Ran the quarterly planning workshop'],
    ['personal', 'Planned the weekend trip with family'],
    ['work', 'Shipped CSV import for enterprise customers'],
    ['learning', 'Read two chapters of a management book'],
    ['work', 'Fixed the flaky checkout test that blocked releases'],
    ['leadership', 'Hosted the launch retro with product and support'],
    ['work', 'Launch checklist for v3.2 signed off by QA'],
    ['health', 'Meditated for 15 minutes'],
    ['work', 'Closed 14 support tickets and documented two recurring bugs'],
    ['other', 'Organized the team offsite logistics'],
    ['learning', 'Built a small CLI to learn Rust ownership'],
    ['work', 'Presented Q3 metrics to leadership']
  ];

  const data = {};
  let n = 0;
  const push = (d, cat, text, h, m) => {
    (data[key(d)] ||= []).unshift({ id: `demo-${n++}`, text, category: cat, timestamp: at(d, h, m) });
  };
  // Older history (skip ~1/3 of days), plus an unbroken 9-day streak.
  let p = 0;
  for (let i = -70; i <= -1; i++) {
    const d = day(i);
    const streak = i >= -9;
    if (!streak && (i % 3 === 0 || d.getDay() === 0)) continue;
    const count = streak ? 2 + (Math.abs(i) % 2) : 1 + (Math.abs(i) % 3 === 1 ? 1 : 0);
    for (let k = 0; k < count; k++) {
      const [cat, text] = pool[p++ % pool.length];
      push(d, cat, text, 9 + k * 3, (i * 7 + k * 13 + 70 * 7) % 60);
    }
  }
  const t = today;
  push(t, 'health', '30-minute run before standup', 8, 5);
  push(t, 'learning', 'Finished the replication chapter of Designing Data-Intensive Applications', 10, 40);
  push(t, 'work', 'Unblocked the payments migration by pairing with Priya for an hour', 13, 15);
  push(t, 'leadership', 'Led sprint retro and agreed on 3 process fixes with the team', 15, 30);
  push(t, 'work', 'Shipped the new onboarding flow — activation up 12% in week one', 17, 45);

  const theme = shot === '4' ? 'dark' : 'light';
  localStorage.clear();
  localStorage.setItem('achievements', JSON.stringify(data));
  localStorage.setItem('prefs', JSON.stringify({ theme, category: 'work', range: 'quarter', format: 'pdf' }));
  localStorage.setItem('kpi-theme', theme);

  /* ---------- Scenes ---------- */
  const check = (c) => `<svg viewBox="0 0 20 20" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="17" height="17" rx="4" fill="${c}" stroke="none" opacity=".14"/><path d="M6 10.2l2.6 2.6L14 7.4"/></svg>`;
  const scenes = {
    1: {
      h: 'Log your wins<br>in seconds.',
      lead: 'Capture what you shipped, fixed and learned — right from your browser toolbar.',
      bullets: ['Type, press Enter, done', 'Tag by Work, Leadership, Learning & more', 'Streaks keep the habit going']
    },
    2: {
      h: 'Find any win,<br>instantly.',
      lead: 'Search across months of history and filter by category when it’s review time.',
      bullets: ['Full-text search with highlights', 'Jump straight to any day', 'Open with Alt + Shift + K']
    },
    3: {
      h: 'Review-ready<br>reports.',
      lead: 'Export a day, week, month, quarter or year as a clean PDF, CSV or Markdown.',
      bullets: ['Grouped by category', 'Copy as Markdown for docs & Slack', 'Perfect for 1:1s and self-reviews']
    },
    4: {
      h: 'Easy on the eyes,<br>day or night.',
      lead: 'A calm, distraction-free page that follows your system theme — or pick your own.',
      bullets: ['Light and dark themes', 'Inline editing with undo', 'Keyboard-first navigation']
    },
    5: {
      h: 'Private<br>by design.',
      lead: 'No account, no servers, no tracking. Your wins never leave your device.',
      bullets: ['Stored locally in Chrome', 'One-click backup & restore', 'Works fully offline']
    }
  };

  if (shot === 'tile' || shot === 'marquee') {
    document.body.className = shot;
    const big = shot === 'marquee';
    document.body.innerHTML = `
      <div style="height:100%;display:flex;align-items:center;justify-content:${big ? 'flex-start' : 'center'};gap:${big ? 28 : 18}px;padding:0 ${big ? 110 : 0}px;">
        <img src="../store/icon/icon-512.png" style="width:${big ? 150 : 84}px;height:${big ? 150 : 84}px">
        <div>
          <div style="font-size:${big ? 64 : 34}px;font-weight:700;letter-spacing:-.02em;line-height:1.05">KPI Tracker</div>
          <div style="font-size:${big ? 26 : 15}px;color:rgba(55,53,47,.65);margin-top:${big ? 12 : 6}px;line-height:1.35">Log daily wins.<br>Export review-ready reports.</div>
        </div>
      </div>
      ${big ? '<div class="frame" style="right:110px;transform:translateY(-50%) scale(.86)"><iframe id="app" src="../popup.html"></iframe></div>' : ''}`;
  } else {
    const s = scenes[shot];
    if (theme === 'dark') document.body.className = 'dark';
    const c = theme === 'dark' ? '#529cca' : '#2383e2';
    document.body.innerHTML = `
      <div class="stage">
        <div class="copy">
          <div class="eyebrow"><img src="../icons/icon128.png" alt="">KPI Tracker</div>
          <h1>${s.h}</h1>
          <p class="lead">${s.lead}</p>
          <ul>${s.bullets.map((b) => `<li>${check(c)}${b}</li>`).join('')}</ul>
        </div>
        <div class="frame"><iframe id="app" src="../popup.html"></iframe></div>
      </div>`;
  }

  const frame = document.getElementById('app');
  if (!frame) return;
  frame.addEventListener('load', () => setTimeout(() => {
    const doc = frame.contentDocument;
    const $ = (id) => doc.getElementById(id);
    const still = doc.createElement('style');
    still.textContent = '*,*::before,*::after,::backdrop{animation:none!important;transition:none!important}';
    doc.head.append(still);
    doc.activeElement && doc.activeElement.blur();
    if (shot === '2') {
      $('searchBtn').click();
      $('searchInput').value = 'launch';
      $('searchInput').dispatchEvent(new Event('input'));
      $('searchInput').blur();
    } else if (shot === '3') {
      $('exportBtn').click();
      doc.activeElement && doc.activeElement.blur();
    } else if (shot === '4') {
      $('prevDay').click();
    } else if (shot === '5') {
      $('menuBtn').click();
    }
  }, 250));
})();
</script>
</body>
</html>
